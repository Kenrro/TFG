server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  servicescredential:
    apiUrl: http://localhost:8081/api-key/get-public-key
    authServiceUrl: http://localhost:8081/api/auth/
    establishment-service-stablishment-url: http://localhost:8080/stablishments
    product-service-url: http://localhost:8082/products
    transaction-process-url: http://localhost:8083/v1/transaction-process
