server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  servicescredential:
    apiUrl: http://localhost:8081/api-key/get-public-key
    authServiceUrl: http://localhost:8081/api/auth/
    productServiceUrl: http://localhost:8082/products
    incentive-service-user-points-url: http://localhost:8084/v1/user-points
    incentive-service-stablishment-configuration-url: http://localhost:8084/v1/stablishment-configurations
