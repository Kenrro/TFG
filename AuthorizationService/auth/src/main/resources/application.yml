server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: Authorization-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

app:
  jwt:
    secret:
      private: |
        
      public: |
        
    expiration-ms: 86400000

  servicescredential:
    password: servicepass
  microservices:
    establishment-service-stablishment-url: http://localhost:8080/stablishments
    establishment-service-userstablishment-url: http://localhost:8080/user-stablishments
